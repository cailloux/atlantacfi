name: deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true # PaperMod theme
          fetch-depth: 0 # Hugo reads git history for page dates
      - uses: actions/setup-node@v7
        with:
          node-version: 26

      # Pull requests only check that the site builds.
      - if: github.event_name == 'pull_request'
        run: ./build.sh

      # `wrangler deploy` runs build.sh itself via [build] in wrangler.toml, then uploads ./public.
      - if: github.event_name != 'pull_request'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 5921308acc24ba24740c774dac0b6061
        run: npx --yes wrangler@4 deploy --tag "$GITHUB_SHA" --message "main $GITHUB_SHA"
